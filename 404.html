<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Halaman tidak ditemukan — Adinda &amp; Bima</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh;
    display: grid; place-items: center;
    background: #F3EFE7; color: #1D1B17;
    font-family: "Inter", system-ui, sans-serif;
    text-align: center; padding: 32px;
  }
  p.kicker {
    font-size: 10px; letter-spacing: .28em; text-transform: uppercase;
    color: #A9825A; margin: 0 0 18px;
  }
  h1 {
    font-family: "Instrument Serif", Georgia, serif; font-weight: 400;
    font-size: clamp(40px, 8vw, 72px); line-height: 1.02;
    letter-spacing: -.02em; margin: 0 0 18px;
  }
  p.body { color: #625C52; font-weight: 300; max-width: 40ch; margin: 0 auto 32px; }
  a {
    display: inline-block;
    font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
    text-decoration: none; color: #1D1B17;
    border: 1px solid #3E4A3A; padding: 14px 26px;
    transition: background .25s, color .25s;
  }
  a:hover { background: #3E4A3A; color: #F3EFE7; }
</style>
</head>
<body>
<main>
  <p class="kicker">404</p>
  <h1>Halaman ini tidak<br />ada di undangan.</h1>
  <p class="body">Mungkin tautannya salah, atau halamannya sudah dipindahkan. Kembali ke sampul, ya.</p>
  <a href="/">Kembali ke Undangan</a>
</main>
</body>
</html>
